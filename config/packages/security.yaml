security:
    enable_authenticator_manager: true
    providers:
        app_user_provider:
            entity:
                class: App\Entity\Users
                property: email
    password_hashers:
        App\Entity\Users:
            algorithm: auto
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            custom_authenticators:
                - App\Security\LoginAuthenticator
                - App\Security\GoogleAuthenticator
            logout:
                path: app_logout
                target: app_login
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800 # 1 semaine
                path: /
                name: TUNIRH_REMEMBERME
                secure: false # Pour HTTP local
                httponly: true
                always_remember_me: false
                remember_me_parameter: remember_me

    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/connect/google, roles: PUBLIC_ACCESS }
        - { path: ^/connect/google/check, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_RH } # Exemple pour Responsable RH
        - { path: ^/, roles: [ROLE_EMPLOYE, ROLE_CANDIDAT, ROLE_RH] }
        - { path: ^/signup, roles: PUBLIC_ACCESS }
when@test:
    security:
        password_hashers:
            App\Entity\Users:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
